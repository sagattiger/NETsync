[project]
name = "netsync"
version = "0.1.0"
description = "NETsync - SNMP network monitoring server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pysnmp>=7.1",
    "redis>=5.0",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
    "icmplib>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
netsync-api = "netsync.cli:run_api"
netsync-worker = "netsync.cli:run_worker"
netsync-admin = "netsync.cli:admin"

# External plugins register themselves under this entry point group, e.g.
# [project.entry-points."netsync.plugins"]
# smokeping = "netsync_smokeping:plugin"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["netsync*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
