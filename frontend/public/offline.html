<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NETsync · offline</title>
  <meta name="theme-color" content="#FF58AE" />
  <style>
    :root { color-scheme: light dark; --bg: #f6f6f7; --fg: #18181b; --muted: #6b6b75; }
    @media (prefers-color-scheme: dark) { :root { --bg: #101010; --fg: #f4f4f5; --muted: #9a9aa3; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font: 15px/1.5 Inter, system-ui, sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
    img { width: 64px; height: 64px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { margin: 0 0 20px; color: var(--muted); max-width: 26rem; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
      background: #FF58AE; color: #fff; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" />
    <h1>NETsync can't be reached</h1>
    <p>This device is offline, or the NETsync server isn't answering. The page reloads by itself when it's back.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
    setInterval(function () { fetch("/", { method: "HEAD", cache: "no-store" }).then(function () { location.reload(); }).catch(function () {}); }, 15000);
  </script>
</body>
</html>
