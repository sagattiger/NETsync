server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve "api" through Docker's DNS on each request instead of once at startup,
    # so recreating the api container (new IP) doesn't cause 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ws {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # Browser-facing parts of container plugins (e.g. the SSH terminal socket): /plugins/<name>/public/...
    location ~ "^/plugins/([a-z][a-z0-9_]{1,30})/public/(.*)$" {
        set $plugin http://netsync-plugin-$1:8080;
        proxy_pass $plugin/public/$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location /api/ {
        client_max_body_size 10m;  # Uptime Kuma backup import
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
